name: Portfolio
on:
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: $ {{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup github pages/ configure github pages
        uses: actions/configure-pages@v4

      - name: upload static file/artifacts
        uses: actions/upload-pages-artifact@v4
        with: 
          path: .

      - name: deploy pages
        uses: actions/deploy-pages@v4